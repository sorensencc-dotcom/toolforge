services:
  postgres:
    image: postgres:16-alpine
    container_name: toolforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toolforge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - toolforge-prod-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/sorensencc-dotcom/toolforge:latest
    container_name: toolforge-api-prod
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"
    ports:
      - "3000:3000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - toolforge-prod-network

volumes:
  postgres-data:

networks:
  toolforge-prod-network:
    driver: bridge
