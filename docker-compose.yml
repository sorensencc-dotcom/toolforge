version: '3.9'

services:
  # Ollama service for local model inference
  ollama:
    image: ollama/ollama:latest
    container_name: toolforge-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - toolforge-network

  # API Server
  api:
    image: node:24-alpine
    container_name: toolforge-api
    working_dir: /app
    command: npm run api:dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_TIMEOUT: 30000
      COWORK_API_URL: http://127.0.0.1:4790
      COWORK_API_KEY: mock-api-key-1234567890ab
      COWORK_GATEWAY_ID: toolforge-gateway
      COWORK_SYNC_INTERVAL: 300
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - toolforge-network
    env_file:
      - .env.local

  # React UI development server
  ui:
    image: node:24-alpine
    container_name: toolforge-ui
    working_dir: /app
    command: npm run ui:dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - toolforge-network
    env_file:
      - .env.local

volumes:
  ollama-data:
    driver: local

networks:
  toolforge-network:
    driver: bridge
