# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: CIC + Rewrite Labs Knowledge Base
site_description: >
  Unified governance documentation for the Cognitive Intelligence Core (CIC)
  and Rewrite Labs (RL) platform — covering architecture, knowledge-base
  operations, skill governance, system state, and operational runbooks.
site_author: Rewrite Labs Engineering
site_url: https://rewrite-labs.github.io/cic-kb/
docs_dir: docs
site_dir: site

repo_url: https://github.com/rewrite-labs/cic-kb
repo_name: rewrite-labs/cic-kb
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.follow
    - toc.integrate

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page

exclude_docs: |
  DOCS_INDEX.md
  daemons/**
  gateway/**
  sync-tools/**
  utilities/**
  archive/**
  meta/archive/**
  meta/**
  reports/**
  logs/**
  superpowers/**
  .tmp.driveupload/**
  **/node_modules/**
  **/.git/**

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rewrite-labs/cic-kb
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
