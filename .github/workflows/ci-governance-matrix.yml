name: CI governance gate matrix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: governance-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: ${{ matrix.repository }} governance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: CIC-GOVERNANCE
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: kb-sync
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: trm
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: cic-ingestion
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: toolforge
            validate: npm --prefix CIC-GOVERNANCE run gov:validate
            smoke: npm test
          - repository: sigil-repo
            validate: npm run audit:jcs
            smoke: npm test
          - repository: cic-vision-governance
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: charlie-deep-research
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: financeos
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: TheFoundry
            validate: npm run gov:validate
            smoke: npm run gov:smoke

    steps:
      - name: Checkout matrix repository
        uses: actions/checkout@v4
        with:
          repository: sorensencc-dotcom/${{ matrix.repository }}
          path: workspace

      - name: Checkout CIC-GOVERNANCE repository
        uses: actions/checkout@v4
        with:
          repository: sorensencc-dotcom/CIC-GOVERNANCE
          path: CIC-GOVERNANCE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: workspace
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run governance validation
        working-directory: workspace
        run: ${{ matrix.validate }}

      - name: Run governance smoke test
        working-directory: workspace
        run: ${{ matrix.smoke }}