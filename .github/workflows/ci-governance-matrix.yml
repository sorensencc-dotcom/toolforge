name: CI governance gate matrix

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: governance-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    name: ${{ matrix.repository }} governance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: toolforge
            validate: npm --prefix CIC-GOVERNANCE run gov:validate
            smoke: npm test
            install_flags: --no-audit --legacy-peer-deps
          - repository: kb-sync
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: trm
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: cic-ingestion
            validate: npm run gov:validate
            smoke: npm run gov:smoke
          - repository: sigil
            validate: npm run audit:jcs
            smoke: npm test

    steps:
      - name: Checkout matrix repository
        uses: actions/checkout@v4
        with:
          repository: sorensencc-dotcom/${{ matrix.repository }}
          token: ${{ secrets.GH_PAT || secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          path: workspace

      - name: Checkout toolforge governance source
        uses: actions/checkout@v4
        with:
          repository: sorensencc-dotcom/toolforge
          token: ${{ secrets.GH_PAT || secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          path: toolforge-source
          sparse-checkout: CIC-GOVERNANCE
          sparse-checkout-cone-mode: true

      - name: Link CIC-GOVERNANCE
        run: |
          mkdir -p workspace/CIC-GOVERNANCE
          cp -a toolforge-source/CIC-GOVERNANCE/. workspace/CIC-GOVERNANCE/
          mkdir -p CIC-GOVERNANCE
          cp -a toolforge-source/CIC-GOVERNANCE/. CIC-GOVERNANCE/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: workspace
        run: npm ci --ignore-scripts || npm install --ignore-scripts ${{ matrix.install_flags }}

      - name: Run governance validation
        working-directory: workspace
        run: ${{ matrix.validate }}

      - name: Run governance smoke test
        working-directory: workspace
        run: ${{ matrix.smoke }}