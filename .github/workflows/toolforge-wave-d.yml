name: Wave D Gate
run-name: Wave D Gate (v1.0.0)

on:
  push:
    branches: [main]
    paths:
      - "src/db/**"
      - "src/e2e/**"
      - "src/load-tests/**"
      - "src/api/**"
      - "src/services/**"
      - "package.json"
      - ".github/workflows/toolforge-wave-d.yml"
  pull_request:
    paths:
      - "src/db/**"
      - "src/e2e/**"
      - "src/load-tests/**"
      - "src/api/**"
      - "src/services/**"
      - "package.json"
      - ".github/workflows/toolforge-wave-d.yml"
  workflow_dispatch:

jobs:
  wave-d-gate:
    name: Wave D Gate (PG + migrate + e2e + load)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: toolforge
          POSTGRES_PASSWORD: toolforge
          POSTGRES_DB: toolforge_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U toolforge"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://toolforge:toolforge@localhost:5432/toolforge_local
      LOAD_REPORT_OUT: ${{ github.workspace }}/wave-d-artifacts/load-report.json
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit

      - name: Wait for Postgres to be ready
        run: |
          node -e '
          const net = require("net");
          function check(retries = 20) {
            const socket = net.createConnection(5432, "localhost");
            socket.on("connect", () => { socket.end(); process.exit(0); });
            socket.on("error", () => {
              if (retries <= 0) process.exit(1);
              setTimeout(() => check(retries - 1), 1500);
            });
          }
          check();
          '

      - name: Prepare artifacts dir
        run: mkdir -p wave-d-artifacts

      - name: Run migrations
        run: npm run migrate

      - name: Run E2E tests
        run: npm run e2e | tee wave-d-artifacts/e2e-output.log

      - name: Run marketplace load tests
        run: npm run load:marketplace | tee wave-d-artifacts/load-output.log

      - name: Upload Wave D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-d-artifacts
          path: wave-d-artifacts/**
