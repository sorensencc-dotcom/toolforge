# No `push` trigger: this workflow only runs on `schedule` and
# `workflow_dispatch`, so its own commit-back step (which pushes to
# main) cannot re-trigger it. paths-ignore is not needed because
# there is no push trigger to filter.

name: Slop Grader Sweep

on:
  schedule:
    - cron: '30 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slop-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Slop grader full-repo sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install skill dependencies
        working-directory: skills/slop-grader-sweep
        run: npm ci

      - name: Build skill
        working-directory: skills/slop-grader-sweep
        run: npm run build

      # Runs from the repo root so the sweep glob and drift/SLOP-REPORT.md
      # resolve against the repository, not the skill directory.
      - name: Run sweep
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node skills/slop-grader-sweep/dist/cli.js sweep

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # Stage first: `git diff` alone does not see an untracked report as a
          # change, so the first-ever write would never be committed.
          git add drift/SLOP-REPORT.md
          if git diff --cached --quiet -- drift/SLOP-REPORT.md; then
            echo "No change in drift/SLOP-REPORT.md, skipping commit"
            exit 0
          fi
          git commit -m "chore(slop-sweep): update drift/SLOP-REPORT.md"
          # Advisory-only path: rebase onto main so a commit landing between
          # checkout and push degrades to a retry instead of a red run.
          git pull --rebase origin main
          git push origin HEAD:main
