<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Tests Safe Integration</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Barlow+Condensed:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --paper: #f2ece2; --ink: #2c2420; --muted: #5c5349; --accent: #c4501a; }
body { background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 720px; width: 100%; }
.eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
svg { width: 100%; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flowchart · Integration</p>
<h1>Run Tests Safe</h1>
<svg viewBox="0 0 640 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-tests-safe-title run-tests-safe-desc">
<title id="run-tests-safe-title">Run Tests Safe integration flow</title>
<desc id="run-tests-safe-desc">Flowchart of run-tests-safe: a capped test run is classified as pass, fail or hung, and a hang triggers file detection, lock cleanup and a bounded rerun.</desc>

<line x1="320" y1="184" x2="320" y2="224" stroke="#5c5349" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="320" y1="280" x2="320" y2="320" stroke="#5c5349" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="332" y="292" width="64" height="16" rx="2" fill="#f2ece2"/><text x="364" y="304" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HUNG</text>
<line x1="320" y1="376" x2="320" y2="416" stroke="#5c5349" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="320" y1="568" x2="320" y2="608" stroke="#5c5349" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="160" y="128" width="320" height="56" rx="6" fill="#f2ece2"/>
<rect x="160" y="128" width="320" height="56" rx="6" fill="#f6dfd0" stroke="#c4501a" stroke-width="1"/>

<text x="320" y="456" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">.staging.lock · .kb-sync.lock</text>
<rect x="160" y="512" width="320" height="56" rx="6" fill="#f2ece2"/>
<rect x="160" y="512" width="320" height="56" rx="6" fill="#fbf7f0" stroke="#2c2420" stroke-width="1"/>
<text x="320" y="536" fill="#2c2420" font-size="16" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">Rerun hanging file</text>
<text x="320" y="552" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">--test-timeout=10000</text>

<line x1="32" y1="704" x2="608" y2="704" stroke="rgba(44,36,32,0.12)" stroke-width="0.8"/>
<text x="32" y="724" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
<rect x="104" y="716" width="12" height="12" rx="2" fill="#f6dfd0" stroke="#c4501a"/>

<text x="232" y="724" fill="#5c5349" font-size="8" font-family="'Geist Mono', monospace">STEP</text>
</svg>
</div>
