<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TRM Cognitive Gap Triage & Daily Synthesis Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #f2ece2;
    color: #2c2420;
    font-family: 'Barlow Condensed', sans-serif;
    padding: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .diagram-container {
    background-color: #f2ece2;
    border: 2px solid #5c5349;
    padding: 32px;
    width: 1020px;
    box-shadow: 6px 6px 0px #5c5349;
  }
  .header {
    border-bottom: 2px solid #c4501a;
    padding-bottom: 16px;
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .title-group h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    color: #2c2420;
    letter-spacing: -0.5px;
  }
  .title-group p {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    color: #5c5349;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .badge {
    background-color: #2c2420;
    color: #f2ece2;
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 2px;
    letter-spacing: 0.5px;
  }
  svg {
    width: 100%;
    height: auto;
  }
  .node-rect {
    fill: #f2ece2;
    stroke: #2c2420;
    stroke-width: 2;
  }
  .node-accent {
    fill: #f2ece2;
    stroke: #c4501a;
    stroke-width: 2;
  }
  .node-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    fill: #2c2420;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .node-title-accent {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 17px;
    fill: #c4501a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .node-desc {
    font-family: 'Geist Mono', monospace;
    font-size: 11.5px;
    fill: #5c5349;
  }
  .connector-solid {
    stroke: #2c2420;
    stroke-width: 2;
    fill: none;
  }
  .connector-accent {
    stroke: #c4501a;
    stroke-width: 2;
    stroke-dasharray: 4, 4;
    fill: none;
  }
  .arrowhead {
    fill: #2c2420;
  }
  .arrowhead-accent {
    fill: #c4501a;
  }
  .footer-note {
    margin-top: 20px;
    padding-top: 12px;
    border-top: 1px dashed #5c5349;
    display: flex;
    justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: #5c5349;
  }
</style>
</head>
<body>

<div class="diagram-container">
  <div class="header">
    <div class="title-group">
      <h1>Topic Research Mining: Cognitive Gap Triage & Daily Synthesis</h1>
      <p>Cathryn Lavery Diagram Standard • Closed-Loop Knowledge Retrieval & State Mutation</p>
    </div>
    <div class="badge">SPECIFICATION v1.2.0</div>
  </div>

  <svg viewBox="0 0 950 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" class="arrowhead" />
      </marker>
      <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" class="arrowhead-accent" />
      </marker>
    </defs>

    <!-- Stage 1: Gaps Registry & Daily Orchestration Trigger -->
    <g transform="translate(125, 10)">
      <rect class="node-rect" width="700" height="70" rx="2"/>
      <text x="20" y="28" class="node-title">1. Pending Gaps Ingestion & Daily Orchestration</text>
      <text x="20" y="50" class="node-desc">trm-research-gaps.md (- [ ] [GAP-XX]) • Windows Task Scheduler (Daily 20:30) • Master Pipeline Stage 5</text>
    </g>

    <path d="M 475 80 L 475 110" class="connector-solid" marker-end="url(#arrow)"/>

    <!-- Stage 2: Cache Pre-Sync -->
    <g transform="translate(125, 110)">
      <rect class="node-rect" width="700" height="70" rx="2"/>
      <text x="20" y="28" class="node-title">2. Context Cache Pre-Flight Synchronization</text>
      <text x="20" y="50" class="node-desc">npm run kb:cache:sync • Hash-based incremental sync • SQLite FTS5 triggers (kb_documents ➔ kb_fts)</text>
    </g>

    <path d="M 475 180 L 475 210" class="connector-solid" marker-end="url(#arrow)"/>

    <!-- Stage 3: Cognitive Query Expander (Core Highlight) -->
    <g transform="translate(125, 210)">
      <rect class="node-accent" width="700" height="95" rx="2"/>
      <text x="20" y="28" class="node-title-accent">3. Cognitive Query Expansion Layer (query-expander.mjs)</text>
      <text x="20" y="50" class="node-desc">• Provider Dispatch (Ollama Qwen-2.5 ➔ OpenRouter Gemini ➔ Heuristic Fallback)</text>
      <text x="20" y="68" class="node-desc">• Bounded Concurrency (3x) • Circuit Breaker (2x fails) • SQLite LIMIT 0 Dry-Run Syntax Validation</text>
      <text x="20" y="86" class="node-desc">• Deterministic Stopword Stripping & Blended OR Wildcard Clauses</text>
    </g>

    <path d="M 475 305 L 475 335" class="connector-solid" marker-end="url(#arrow)"/>

    <!-- Stage 4: SQLite FTS5 Match & Evidence Extraction -->
    <g transform="translate(125, 335)">
      <rect class="node-rect" width="700" height="70" rx="2"/>
      <text x="20" y="28" class="node-title">4. Local SQLite FTS5 Context Search & Snippet Extraction</text>
      <text x="20" y="50" class="node-desc">.kb_cache/knowledge.db • BM25 Ranking • Highlight Snippet Extraction • Zero Network Latency (&lt;1ms)</text>
    </g>

    <path d="M 475 405 L 475 435" class="connector-solid" marker-end="url(#arrow)"/>

    <!-- Stage 5: RFC Decision Note Synthesis -->
    <g transform="translate(125, 435)">
      <rect class="node-rect" width="700" height="70" rx="2"/>
      <text x="20" y="28" class="node-title">5. RFC Decision Document Synthesis</text>
      <text x="20" y="50" class="node-desc">Materializes wiki/research/rfc-gap-*.md with Problem Context, Evidence Citations, & Protocol Decisions</text>
    </g>

    <path d="M 475 505 L 475 535" class="connector-solid" marker-end="url(#arrow)"/>

    <!-- Stage 6: State Mutation & Feedback Loop -->
    <g transform="translate(125, 535)">
      <rect class="node-accent" width="700" height="75" rx="2"/>
      <text x="20" y="28" class="node-title-accent">6. Closed-Loop State Mutation & Downstream Indexing</text>
      <text x="20" y="50" class="node-desc">• Mutates trm-research-gaps.md: - [ ] ➔ - [/] [GAP-XX] Title (Drafted: [RFC](wiki/research/...))</text>
      <text x="20" y="68" class="node-desc">• Re-indexes new RFCs via kb:cache:sync • MCP query_context_cache / fetch_topic_note immediately active</text>
    </g>

    <!-- Feedback Loop Arrow back to Gaps File / Cache -->
    <path d="M 825 572 L 870 572 L 870 45 L 825 45" class="connector-accent" marker-end="url(#arrow-accent)"/>

  </svg>

  <div class="footer-note">
    <span>SYSTEM: TRM AUTOMATED GAP TRIAGE PIPELINE</span>
    <span>PALETTE: CATHRYN LAVERY WARM PAPER (#F2ECE2 / #C4501A)</span>
  </div>
</div>

</body>
</html>
