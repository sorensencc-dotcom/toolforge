<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Barlow+Condensed:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
  
  body {
    margin: 0;
    padding: 30px;
    background-color: #f2ece2;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Barlow Condensed', -apple-system, sans-serif;
  }

  .diagram-container {
    width: 960px;
    background: #f2ece2;
    padding: 20px;
    box-sizing: border-box;
  }

  svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .title-serif {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 24px;
    font-weight: 600;
    fill: #2c2420;
    letter-spacing: -0.5px;
  }

  .subtitle-sans {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    fill: #5c5349;
    font-weight: 600;
  }

  .box-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    fill: #2c2420;
    letter-spacing: 0.5px;
  }

  .box-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 500;
    fill: #5c5349;
  }

  .badge-text {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 500;
  }

  .code-text {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    fill: #2c2420;
  }
</style>
</head>
<body>
<div class="diagram-container">
<svg viewBox="0 0 920 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#2c2420" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c4501a" />
    </marker>
  </defs>

  <!-- Header -->
  <text x="460" y="38" text-anchor="middle" class="title-serif">Unified Multi-Client MCP Governance Architecture</text>
  <text x="460" y="58" text-anchor="middle" class="subtitle-sans">Canonical Registry • AST Surgical Compilers • Exact Token Budgets</text>

  <!-- Canonical Registry Box (Top Center) -->
  <g transform="translate(290, 80)" filter="url(#subtle-shadow)">
    <rect width="340" height="95" rx="8" fill="#ffffff" stroke="#c4501a" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="26" rx="8" fill="#c4501a"/>
    <rect x="0" y="16" width="340" height="10" fill="#c4501a"/>
    <text x="170" y="18" text-anchor="middle" fill="#ffffff" class="badge-text" font-weight="600">CANONICAL REGISTRY SOURCE</text>
    <text x="170" y="50" text-anchor="middle" class="box-label">.sigil/mcp-registry.toml</text>
    <text x="170" y="68" text-anchor="middle" class="box-sub">v2026-09-08 • 5 Profiles • 7 Servers • Budget Rules</text>
    <text x="170" y="86" text-anchor="middle" class="badge-text" fill="#c4501a">js-tiktoken (cl100k_base) exact schema validator</text>
  </g>

  <!-- Middle Layer: CLI Controller & AST Compilers -->
  <g transform="translate(160, 220)" filter="url(#subtle-shadow)">
    <rect width="600" height="75" rx="8" fill="#faf6f0" stroke="#5c5349" stroke-width="1.5"/>
    <text x="300" y="26" text-anchor="middle" class="box-label">scripts/mcp-governance/cli.mjs &amp; compilers.mjs</text>
    <text x="300" y="46" text-anchor="middle" class="box-sub">Surgical Block Replacement • .bak Backups • Atomic File Renames</text>
    <text x="300" y="64" text-anchor="middle" class="code-text" fill="#5c5349">Commands: status (manifest) | validate (exit 10/50) | sync (--dry-run) | profile set</text>
  </g>

  <!-- Connectors: Registry to Compiler -->
  <line x1="460" y1="175" x2="460" y2="218" stroke="#c4501a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connectors: Compiler to Client Targets -->
  <path d="M 230 295 L 230 330 L 100 330 L 100 360" fill="none" stroke="#c4501a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 340 295 L 340 360" fill="none" stroke="#c4501a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 295 L 460 360" fill="none" stroke="#c4501a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 580 295 L 580 360" fill="none" stroke="#c4501a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 690 295 L 690 330 L 820 330 L 820 360" fill="none" stroke="#c4501a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Client 1: Codex CLI -->
  <g transform="translate(20, 365)" filter="url(#subtle-shadow)">
    <rect width="160" height="145" rx="6" fill="#ffffff" stroke="#5c5349" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#2c2420"/>
    <rect x="0" y="14" width="160" height="8" fill="#2c2420"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffffff" class="badge-text">CODEX CLI</text>
    <text x="80" y="42" text-anchor="middle" class="box-label">~/.codex/config.toml</text>
    <text x="80" y="60" text-anchor="middle" class="box-sub">Profile: <tspan font-weight="700" fill="#c4501a">dev</tspan></text>
    <text x="80" y="78" text-anchor="middle" class="badge-text" fill="#5c5349">3 Servers / 3 Tools</text>
    <text x="80" y="96" text-anchor="middle" class="badge-text" fill="#5c5349">3,300 / 12k Tokens</text>
    <rect x="25" y="110" width="110" height="22" rx="4" fill="#e5f4ea"/>
    <text x="80" y="125" text-anchor="middle" fill="#137333" class="badge-text" font-weight="700">+8,700 HEADROOM</text>
  </g>

  <!-- Client 2: Claude Code CLI -->
  <g transform="translate(200, 365)" filter="url(#subtle-shadow)">
    <rect width="160" height="145" rx="6" fill="#ffffff" stroke="#5c5349" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#2c2420"/>
    <rect x="0" y="14" width="160" height="8" fill="#2c2420"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffffff" class="badge-text">CLAUDE CODE CLI</text>
    <text x="80" y="42" text-anchor="middle" class="box-label">~/.claude.json</text>
    <text x="80" y="60" text-anchor="middle" class="box-sub">Profile: <tspan font-weight="700" fill="#c4501a">dev</tspan></text>
    <text x="80" y="78" text-anchor="middle" class="badge-text" fill="#5c5349">3 Servers / 3 Tools</text>
    <text x="80" y="96" text-anchor="middle" class="badge-text" fill="#5c5349">3,300 / 12k Tokens</text>
    <rect x="25" y="110" width="110" height="22" rx="4" fill="#e5f4ea"/>
    <text x="80" y="125" text-anchor="middle" fill="#137333" class="badge-text" font-weight="700">+8,700 HEADROOM</text>
  </g>

  <!-- Client 3: Claude Desktop -->
  <g transform="translate(380, 365)" filter="url(#subtle-shadow)">
    <rect width="160" height="145" rx="6" fill="#ffffff" stroke="#5c5349" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#2c2420"/>
    <rect x="0" y="14" width="160" height="8" fill="#2c2420"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffffff" class="badge-text">CLAUDE DESKTOP</text>
    <text x="80" y="42" text-anchor="middle" class="box-label">claude_desktop.json</text>
    <text x="80" y="60" text-anchor="middle" class="box-sub">Profile: <tspan font-weight="700" fill="#c4501a">full</tspan></text>
    <text x="80" y="78" text-anchor="middle" class="badge-text" fill="#5c5349">6 Servers / 6 Tools</text>
    <text x="80" y="96" text-anchor="middle" class="badge-text" fill="#5c5349">19,300 / 45k Tokens</text>
    <rect x="25" y="110" width="110" height="22" rx="4" fill="#e5f4ea"/>
    <text x="80" y="125" text-anchor="middle" fill="#137333" class="badge-text" font-weight="700">+25,700 HEADROOM</text>
  </g>

  <!-- Client 4: Antigravity IDE -->
  <g transform="translate(560, 365)" filter="url(#subtle-shadow)">
    <rect width="160" height="145" rx="6" fill="#ffffff" stroke="#5c5349" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#2c2420"/>
    <rect x="0" y="14" width="160" height="8" fill="#2c2420"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffffff" class="badge-text">ANTIGRAVITY IDE</text>
    <text x="80" y="42" text-anchor="middle" class="box-label">mcp_config.json</text>
    <text x="80" y="60" text-anchor="middle" class="box-sub">Profile: <tspan font-weight="700" fill="#c4501a">full</tspan></text>
    <text x="80" y="78" text-anchor="middle" class="badge-text" fill="#5c5349">6 Servers / 6 Tools</text>
    <text x="80" y="96" text-anchor="middle" class="badge-text" fill="#5c5349">19,300 / 45k Tokens</text>
    <rect x="25" y="110" width="110" height="22" rx="4" fill="#e5f4ea"/>
    <text x="80" y="125" text-anchor="middle" fill="#137333" class="badge-text" font-weight="700">+25,700 HEADROOM</text>
  </g>

  <!-- Client 5: Grok Bot Bridge -->
  <g transform="translate(740, 365)" filter="url(#subtle-shadow)">
    <rect width="160" height="145" rx="6" fill="#ffffff" stroke="#5c5349" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="22" rx="6" fill="#2c2420"/>
    <rect x="0" y="14" width="160" height="8" fill="#2c2420"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffffff" class="badge-text">GROK BOT BRIDGE</text>
    <text x="80" y="42" text-anchor="middle" class="box-label">grok-bridge/config.json</text>
    <text x="80" y="60" text-anchor="middle" class="box-sub">Profile: <tspan font-weight="700" fill="#c4501a">dev-minimal</tspan></text>
    <text x="80" y="78" text-anchor="middle" class="badge-text" fill="#5c5349">2 Servers / 2 Tools</text>
    <text x="80" y="96" text-anchor="middle" class="badge-text" fill="#5c5349">1,800 / 5k Tokens</text>
    <rect x="25" y="110" width="110" height="22" rx="4" fill="#e5f4ea"/>
    <text x="80" y="125" text-anchor="middle" fill="#137333" class="badge-text" font-weight="700">+3,200 HEADROOM</text>
  </g>

</svg>
</div>
</body>
</html>
