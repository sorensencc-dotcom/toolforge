apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toolforge-api-hpa
  labels:
    app.kubernetes.io/name: toolforge-api
    app.kubernetes.io/part-of: toolforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toolforge-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
